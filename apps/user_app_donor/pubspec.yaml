name: shodasha_donor
description: "Shodasha donor-parity customer app - donor screens over the Shodasha API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  geocoding: ^4.0.0
  razorpay_flutter: ^1.4.7
  table_calendar: ^3.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher icon from the public logo (single source: public/logo.png,
# mirrored at assets/logo.png). White adaptive background, no emoji/shadow.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  # Real brand assets (no placeholders in shipped screens). login_hero.jpg
  # is the donor hero image, adopted with the donor UI import.
  assets:
    - assets/logo.png
    - assets/20l.jpg
    - assets/images/
