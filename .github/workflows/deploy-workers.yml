name: deploy-workers

# Deploys Cloudflare Workers on push to main when backend code changes.
# Deploys all 3 workers in the architecture:
#   1. water (customer / donor / core API)
#   2. water-ops (vendor & rider operations API)
#   3. water-admin (admin dashboard API)
on:
  push:
    branches:
      - main
    paths:
      - 'workers/api/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workers-main
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: test + deploy cloudflare workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Node.js 22 (Wrangler requires >= 22.12.0)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: 'workers/api/package.json'

      - name: Install Wrangler dependencies
        run: npm ci || npm install --no-fund --no-audit

      - name: Run backend tests
        run: uv run pytest -q

      - name: Deploy water Worker (Customer / Donor Core)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy

      - name: Deploy water-ops Worker (Vendor & Rider Operations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy --config wrangler.ops.jsonc

      - name: Deploy water-admin Worker (Admin Portal Operations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy --config wrangler.admin.jsonc
