name: AI Mobile Testing (OpenCode)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which Shodasha Flutter app to test"
        type: choice
        options:
          - all
          - donor
          - vendor
          - rider
        default: all
      primary_model:
        description: "Optional free opencode/<model> override (leave blank to auto-detect)"
        default: ""
      fallback_model:
        description: "Optional fallback free opencode/<model> override"
        default: ""
      brief:
        description: "Path to QA brief"
        default: "tools/mobile-tester/BRIEF.md"
  workflow_run:
    workflows: ["ci", "release"]
    types: [completed]

permissions:
  contents: read

jobs:
  plan:
    name: Plan test matrix
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          APP_INPUT: ${{ inputs.app || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os
          app = os.environ["APP_INPUT"]
          all_apps = [
            {
              "app": "donor",
              "dir": "apps/user_app_donor",
              "app_id": "com.shodasha.shodasha_donor",
              "label": "Shodasha Customer App",
              "dart_defines": "--dart-define=SHODASHA_API_BASE=https://water.adityathakur452007.workers.dev/v1 --dart-define=RAZORPAY_KEY_ID=rzp_test_Thq4I47cEMIjbF",
            },
            {
              "app": "vendor",
              "dir": "apps/vendor_app",
              "app_id": "com.shodasha.vendor_app",
              "label": "Shodasha Vendor App",
              "dart_defines": "--dart-define=SHODASHA_API_BASE=https://water-ops.adityathakur452007.workers.dev/v1",
            },
            {
              "app": "rider",
              "dir": "apps/rider_app",
              "app_id": "com.shodasha.rider_app",
              "label": "Shodasha Rider App",
              "dart_defines": "--dart-define=SHODASHA_API_BASE=https://water-ops.adityathakur452007.workers.dev",
            },
          ]
          selected = all_apps if app == "all" else [a for a in all_apps if a["app"] == app]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("matrix=" + json.dumps(selected) + "\n")
          PY

  test-android:
    name: AI Test — ${{ matrix.label }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Latest LTS JDK supported by Gradle 9.1.0 & AGP 9.0.1 (bytecode targets Java 17)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true
          cache-key: ai-${{ matrix.app }}-${{ hashFiles(format('{0}/pubspec.lock', matrix.dir)) }}

      - name: Build debug APK (pointing to live Cloudflare Workers)
        working-directory: ${{ matrix.dir }}
        run: |
          flutter pub get
          flutter build apk --debug ${{ matrix.dart_defines }}

      - name: Install OpenCode CLI & Python Pillow
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          python3 -m pip install --quiet pillow

      - name: Verify free OpenCode model (no paid APIs allowed)
        id: models
        env:
          PRIMARY_MODEL: ${{ inputs.primary_model }}
          FALLBACK_MODEL: ${{ inputs.fallback_model }}
        run: |
          opencode --version
          python3 tools/mobile-tester/verify_free_model.py

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator + OpenCode QA Agent
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/mobile-tester/run_android_agent.sh
        env:
          APP_NAME: ${{ matrix.app }}
          APP_ID: ${{ matrix.app_id }}
          APK_PATH: ${{ matrix.dir }}/build/app/outputs/flutter-apk/app-debug.apk
          PRIMARY_MODEL: ${{ steps.models.outputs.primary_model }}
          FALLBACK_MODEL: ${{ steps.models.outputs.fallback_model }}
          BRIEF_PATH: ${{ inputs.brief || 'tools/mobile-tester/BRIEF.md' }}
          QA_PHONE: ${{ matrix.app == 'donor' && secrets.QA_CUSTOMER_PHONE || (matrix.app == 'rider' && secrets.QA_RIDER_PHONE || '') }}
          QA_PASSWORD: ${{ matrix.app == 'donor' && secrets.QA_CUSTOMER_PASSWORD || '' }}
          QA_ACCESS_CODE: ${{ matrix.app == 'vendor' && secrets.QA_VENDOR_CODE || (matrix.app == 'rider' && secrets.QA_RIDER_CODE || '') }}

      - name: Publish findings to GitHub Actions Summary
        if: always()
        env:
          APP_NAME: ${{ matrix.app }}
          LABEL: ${{ matrix.label }}
        run: |
          {
            echo "## $LABEL (\`$APP_NAME\`)"
            if [ -f "results/$APP_NAME/report.md" ]; then
              cat "results/$APP_NAME/report.md"
            else
              echo "_No report.md was generated._"
            fi
            if [ -f "results/$APP_NAME/findings.json" ]; then
              echo ""
              echo "### Structured Findings (\`findings.json\`)"
              echo '```json'
              cat "results/$APP_NAME/findings.json"
              echo '```'
            fi
            if [ -f "results/$APP_NAME/logcat.txt" ]; then
              CRASHES=$(grep -E "FATAL EXCEPTION|AndroidRuntime|flutter.*Exception" "results/$APP_NAME/logcat.txt" | tail -n 20 || true)
              if [ -n "$CRASHES" ]; then
                echo ""
                echo "### App Crash / Error Excerpt (\`logcat.txt\`)"
                echo '```'
                echo "$CRASHES"
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AI QA screenshots, logs & reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-qa-${{ matrix.app }}-${{ github.run_id }}
          path: results/${{ matrix.app }}/
          retention-days: 14
