name: ci

# Fast feedback on every branch / PR. Never publishes a release.
# Release builds happen only in release.yml (push to main).
on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: analyze + test + debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/user_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.0.1 documents JDK 17 (min + default). Project bytecode
      # target is JavaVersion.VERSION_17 (see android/app/build.gradle.kts),
      # so 17 is the tested runner for this toolchain.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to the Flutter version the app is developed and
      # release-verified with locally (flutter doctor: 3.44.9 stable).
      - name: Set up Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze (must be zero issues)
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: apps/user_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
